[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporio-da-musica"
version = "0.1.0"
description = "Agente de atendimento ao cliente para o Empório da Música"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.10.0",
    "pydantic-ai-slim[google]>=1.0.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
